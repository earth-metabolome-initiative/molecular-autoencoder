name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --no-default-features --features std,ndarray,train,tui,datasets,embed,embed-mgf,embed-parquet,http,huggingface --all-targets

      - name: Clippy
        run: cargo clippy --locked --no-default-features --features std,ndarray,train,tui,datasets,embed,embed-mgf,embed-parquet,http,huggingface --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-default-features --features std,ndarray,train,datasets,embed,embed-mgf,embed-parquet,http,huggingface --all-targets

      - name: Documentation
        run: cargo doc --locked --no-default-features --features std,ndarray,train,datasets,embed,embed-mgf,embed-parquet,http,huggingface --no-deps

  cuda:
    name: CUDA type-check
    # Pin to 22.04 (jammy). NVIDIA only began publishing ubuntu2404 (noble)
    # CUDA packages from 12.5 onwards, so the Jimver action's 12.4.x apt path
    # fails on `ubuntu-latest` (24.04). 22.04 carries the full 12.x history.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cuda

      - name: Check cuda-fusion path
        env:
          CUDARC_CUDA_VERSION: "12040"
        run: cargo check --locked --no-default-features --features std,cuda-fusion,train,tui,datasets,embed,embed-mgf,embed-parquet --all-targets

      - name: Check cuda-no-fusion path
        env:
          CUDARC_CUDA_VERSION: "12040"
        run: cargo check --locked --no-default-features --features std,cuda-no-fusion,train,tui,datasets,embed,embed-mgf,embed-parquet --all-targets

      - name: Clippy cuda-fusion
        env:
          CUDARC_CUDA_VERSION: "12040"
        run: cargo clippy --locked --no-default-features --features std,cuda-fusion,train,tui,datasets,embed,embed-mgf,embed-parquet --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        run: >-
          cargo tarpaulin --engine llvm --locked --no-default-features
          --features std,ndarray,train,datasets,embed,embed-mgf,embed-parquet,cubecl-cpu,http,huggingface
          --all-targets --out Xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage/cobertura.xml
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint slurm/**/*.sh
        run: |
          shopt -s globstar nullglob
          files=(slurm/**/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found under slurm/, nothing to lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck --severity=style --external-sources "${files[@]}"

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wasm

      - name: Check inference core compiles to wasm32
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features std,ndarray

      - name: Check wasm32 with http + huggingface loaders
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features std,ndarray,http,huggingface

      - name: Clippy wasm32 lib
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features std,ndarray,http,huggingface --lib -- -D warnings
