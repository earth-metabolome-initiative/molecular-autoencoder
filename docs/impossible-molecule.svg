<svg xmlns="http://www.w3.org/2000/svg" width="180.95" height="174.25" viewBox="0 0 180.95 174.25" role="img" aria-labelledby="title desc">
  <title id="title">Impossible molecule</title>
  <desc id="desc">Central carbon carrying a positive formal charge, bonded to five hydrogens; the hypervalent five-H configuration alone makes the structure chemically impossible, regardless of charge magnitude.</desc>
  <defs>
    <style>
      .bond { stroke: #1f2937; stroke-width: 3.5; stroke-linecap: round; }
      .atomCircle { stroke: #0f172a; stroke-width: 2.5; }
      .carbonFill { fill: #0f172a; }
      .hydrogenFill { fill: #22d3ee; stroke: none; }
    </style>
  </defs>

  <line class="bond" x1="90.48" y1="72" x2="90.48" y2="38"/>
  <line class="bond" x1="111.4" y1="87.2" x2="143.74" y2="76.7"/>
  <line class="bond" x1="103.41" y1="111.8" x2="123.39" y2="139.3"/>
  <line class="bond" x1="77.54" y1="111.8" x2="57.56" y2="139.3"/>
  <line class="bond" x1="69.55" y1="87.2" x2="37.22" y2="76.7"/>

  <g aria-label="Five hydrogen atoms">
    <circle class="atomCircle hydrogenFill" cx="90.48" cy="22" r="16"/>
    <image href="data:image/png;base64," x="81.3" y="12.83" width="18.34" height="18.34" preserveAspectRatio="xMidYMid meet"/>
    <circle class="atomCircle hydrogenFill" cx="158.95" cy="71.75" r="16"/>
    <image href="data:image/png;base64," x="149.78" y="62.58" width="18.34" height="18.34" preserveAspectRatio="xMidYMid meet"/>
    <circle class="atomCircle hydrogenFill" cx="132.8" cy="152.25" r="16"/>
    <image href="data:image/png;base64," x="123.62" y="143.08" width="18.34" height="18.34" preserveAspectRatio="xMidYMid meet"/>
    <circle class="atomCircle hydrogenFill" cx="48.16" cy="152.25" r="16"/>
    <image href="data:image/png;base64," x="38.98" y="143.08" width="18.34" height="18.34" preserveAspectRatio="xMidYMid meet"/>
    <circle class="atomCircle hydrogenFill" cx="22" cy="71.75" r="16"/>
    <image href="data:image/png;base64," x="12.83" y="62.58" width="18.34" height="18.34" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g aria-label="Central carbon with isotope mass 99 and positive formal charge">
    <circle class="atomCircle carbonFill" cx="90.48" cy="94" r="22"/>
    <image href="data:image/png;base64," x="82.57" y="85.42" width="15.81" height="17.16" preserveAspectRatio="xMidYMid meet"/>
    <image href="data:image/png;base64," x="73.47" y="81.94" width="14" height="9.94" preserveAspectRatio="xMidYMid meet"/>
    <image href="data:image/png;base64," x="93.64" y="81.9" width="13.55" height="11.74" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
